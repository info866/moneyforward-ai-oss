[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "moneyforward-ai-oss"
version = "0.1.0a1"
description = "Independent per-company accounting automation starter"
requires-python = ">=3.11"
readme = "README.md"
license = {file = "LICENSE"}
dependencies = []

[project.optional-dependencies]
test = ["pytest>=8,<9", "ruff>=0.6,<1"]
cloud = ["mcp>=2.2,<3"]

[tool.setuptools.packages.find]
where = ["src"]
include = ["mf_phase12*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
target-version = "py311"

[tool.ruff.lint]
select = ["E9", "F63", "F7", "F82"]
